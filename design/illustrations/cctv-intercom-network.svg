<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <!-- Riyadh Home Solution — CCTV, intercom & network (original artwork): dome camera, intercom with handset, Wi-Fi signal. -->
  <defs>
    <filter id="sticker" x="-10%" y="-10%" width="125%" height="125%" color-interpolation-filters="sRGB">
      <feMorphology in="SourceAlpha" operator="dilate" radius="7" result="spread"/>
      <feFlood flood-color="#FFFFFF" result="white"/>
      <feComposite in="white" in2="spread" operator="in" result="border"/>
      <feOffset in="spread" dx="8" dy="10" result="off"/>
      <feGaussianBlur in="off" stdDeviation="2.5" result="blur"/>
      <feFlood flood-color="#0B2545" flood-opacity="0.2" result="ink"/>
      <feComposite in="ink" in2="blur" operator="in" result="shadow"/>
      <feMerge><feMergeNode in="shadow"/><feMergeNode in="border"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- accents -->
  <path d="M52 232 Q52 248 68 248 Q52 248 52 264 Q52 248 36 248 Q52 248 52 232 Z" fill="#F28C28" stroke="#0B2545" stroke-width="4.5" stroke-linejoin="round"/>
  <path d="M352 268 Q352 280 364 280 Q352 280 352 292 Q352 280 340 280 Q352 280 352 268 Z" fill="#3BA3D9" stroke="#0B2545" stroke-width="4" stroke-linejoin="round"/>
  <circle cx="58" cy="330" r="6" fill="#3BA3D9"/>
  <circle cx="250" cy="44" r="5" fill="#F28C28"/>
  <circle cx="352" cy="330" r="4" fill="#0B2545" opacity="0.35"/>

  <g filter="url(#sticker)" stroke="#0B2545" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
    <!-- Wi-Fi signal -->
    <path d="M258 112 A64 64 0 0 1 354 112" fill="none" stroke="#0B2545" stroke-width="24"/>
    <path d="M258 112 A64 64 0 0 1 354 112" fill="none" stroke="#3BA3D9" stroke-width="9"/>
    <path d="M278 136 A40 40 0 0 1 334 136" fill="none" stroke="#0B2545" stroke-width="24"/>
    <path d="M278 136 A40 40 0 0 1 334 136" fill="none" stroke="#3BA3D9" stroke-width="9"/>
    <circle cx="306" cy="160" r="13" fill="#F28C28"/>

    <!-- dome camera on its ceiling plate -->
    <rect x="70" y="62" width="156" height="24" rx="12" fill="#E6ECF3"/>
    <path d="M86 86 A62 62 0 0 0 210 86 Z" fill="#FFFFFF"/>
    <path d="M104 86 A44 44 0 0 0 192 86 Z" fill="#0B2545" stroke="none"/>
    <circle cx="148" cy="108" r="15" fill="#3BA3D9" stroke="#FFFFFF" stroke-width="4"/>
    <circle cx="143" cy="103" r="4" fill="#FFFFFF" stroke="none"/>
    <circle cx="178" cy="96" r="4.5" fill="#F28C28" stroke="none"/>
    <path d="M86 86 A62 62 0 0 0 210 86 Z" fill="none"/>

    <!-- intercom unit with its handset -->
    <rect x="180" y="182" width="118" height="166" rx="20" fill="#FFFFFF"/>
    <rect x="198" y="200" width="82" height="62" rx="9" fill="#0B2545"/>
    <circle cx="239" cy="222" r="9" fill="#3BA3D9" stroke="none"/>
    <path d="M222 256 Q222 238 239 238 Q256 238 256 256 Z" fill="#3BA3D9" stroke="none"/>
    <path d="M208 282 H234 M208 296 H234 M208 310 H234" fill="none" stroke-width="5"/>
    <circle cx="266" cy="296" r="14" fill="#3BA3D9"/>
    <path d="M150 304 C166 304 160 328 180 326" fill="none" stroke-width="6"/>
    <path d="M112 180 H140 Q152 180 152 192 V336 Q152 348 140 348 H112 Q92 348 92 324 Q92 308 106 304 V224 Q92 220 92 204 Q92 180 112 180 Z" fill="#F28C28"/>
    <path d="M106 199 H128 M106 329 H128" fill="none" stroke="#FFFFFF" stroke-width="5"/>
  </g>
</svg>
