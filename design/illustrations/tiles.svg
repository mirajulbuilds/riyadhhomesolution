<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <!-- Riyadh Home Solution — Tiles (original artwork): a stack of floor tiles with a notched trowel. -->
  <defs>
    <filter id="sticker" x="-10%" y="-10%" width="125%" height="125%" color-interpolation-filters="sRGB">
      <feMorphology in="SourceAlpha" operator="dilate" radius="7" result="spread"/>
      <feFlood flood-color="#FFFFFF" result="white"/>
      <feComposite in="white" in2="spread" operator="in" result="border"/>
      <feOffset in="spread" dx="8" dy="10" result="off"/>
      <feGaussianBlur in="off" stdDeviation="2.5" result="blur"/>
      <feFlood flood-color="#0B2545" flood-opacity="0.2" result="ink"/>
      <feComposite in="ink" in2="blur" operator="in" result="shadow"/>
      <feMerge><feMergeNode in="shadow"/><feMergeNode in="border"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- accents -->
  <path d="M74 92 Q74 110 92 110 Q74 110 74 128 Q74 110 56 110 Q74 110 74 92 Z" fill="#F28C28" stroke="#0B2545" stroke-width="5" stroke-linejoin="round"/>
  <path d="M352 256 Q352 268 364 268 Q352 268 352 280 Q352 268 340 268 Q352 268 352 256 Z" fill="#3BA3D9" stroke="#0B2545" stroke-width="4" stroke-linejoin="round"/>
  <circle cx="160" cy="70" r="6" fill="#3BA3D9"/>
  <circle cx="48" cy="210" r="5" fill="#F28C28"/>
  <circle cx="340" cy="330" r="4" fill="#0B2545" opacity="0.35"/>

  <g filter="url(#sticker)" transform="translate(0 -10)" stroke="#0B2545" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <!-- bottom tile -->
    <path d="M78 290 L184 344 V362 L78 308 Z" fill="#AFC0D2"/>
    <path d="M184 344 L290 290 V308 L184 362 Z" fill="#8FA6BE"/>
    <path d="M184 236 L290 290 L184 344 L78 290 Z" fill="#E6ECF3"/>
    <!-- middle tile -->
    <path d="M78 262 L184 316 V334 L78 280 Z" fill="#3BA3D9"/>
    <path d="M184 316 L290 262 V280 L184 334 Z" fill="#2B86B8"/>
    <path d="M184 208 L290 262 L184 316 L78 262 Z" fill="#BFE3F5"/>
    <!-- top tile: 2 x 2 pattern -->
    <path d="M78 234 L184 288 V306 L78 252 Z" fill="#E6ECF3"/>
    <path d="M184 288 L290 234 V252 L184 306 Z" fill="#C9D6E3"/>
    <path d="M184 180 L290 234 L184 288 L78 234 Z" fill="#FFFFFF"/>
    <path d="M184 180 L237 207 L184 234 L131 207 Z" fill="#3BA3D9" stroke="none"/>
    <path d="M184 234 L237 261 L184 288 L131 261 Z" fill="#3BA3D9" stroke="none"/>
    <path d="M131 207 L237 261 M237 207 L131 261" fill="none" stroke-width="5"/>
    <path d="M184 180 L290 234 L184 288 L78 234 Z" fill="none"/>
    <circle cx="184" cy="234" r="9" fill="#F28C28" stroke-width="5"/>

    <!-- notched trowel leaning on the stack -->
    <g transform="translate(270 164) rotate(-24)">
      <path d="M-66 -34 H66 V30 l-7 8 l-7 -8 l-7 8 l-7 -8 l-7 8 l-7 -8 l-7 8 l-7 -8 l-7 8 l-7 -8 l-7 8 l-7 -8 l-7 8 l-7 -8 l-7 8 l-7 -8 l-7 8 l-6 -8 V-34 Z" fill="#E6ECF3"/>
      <path d="M-54 -22 H40" fill="none" stroke="#FFFFFF" stroke-width="6"/>
      <rect x="-8" y="-46" width="16" height="22" rx="4" fill="#0B2545"/>
      <rect x="-60" y="-70" width="120" height="28" rx="14" fill="#F28C28"/>
      <path d="M-44 -62 H-20" fill="none" stroke="#FFFFFF" stroke-width="5"/>
    </g>
  </g>
</svg>
